name: Hourly Submodule Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest submodule updates
        run: git submodule update --remote --recursive

      - name: Check for submodule changes
        id: check_changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No submodule updates found."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate PR Body
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          cat << 'EOF' > pr_body.md
          ## Submodule Updates Summary

          The following submodules have been updated to their latest remote commits:

          ```diff
          EOF

          git submodule summary >> pr_body.md

          cat << 'EOF' >> pr_body.md
          ```

          ---
          *Automated PR generated by GitHub Actions.*
          EOF

      - name: Create or Update Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update submodules to latest commit"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          signoff: true
          branch: "auto-submodule-update"
          delete-branch: true
          title: "chore: update submodules"
          body-path: "pr_body.md"
          labels: |
            dependencies
            submodules