name: Hourly Submodule Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest submodule updates
        run: git submodule update --remote --recursive

      - name: Generate PR Body
        id: generate-body
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No submodule updates detected."
            exit 0
          fi

          echo "## Submodule Updates Summary" > pr_body.md
          echo "" >> pr_body.md
          echo "The following submodules have been updated to their latest remote commits:" >> pr_body.md
          echo "" >> pr_body.md

          echo '```diff' >> pr_body.md
          git submodule summary >> pr_body.md
          echo '```' >> pr_body.md

          echo "" >> pr_body.md
          echo "---" >> pr_body.md
          echo "*Automated PR generated by GitHub Actions.*" >> pr_body.md

      - name: Create or Update Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update submodules to latest commit"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          signoff: true
          branch: "auto-submodule-update"
          delete-branch: true
          title: "chore: update submodules"
          body-path: "pr_body.md"
          labels: |
            dependencies
            submodules